name: atlas_mobile
description: Project Atlas — consumer mobile (Flutter, V0.5 investor demo)
publish_to: none
version: 0.5.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # State management (founder decision §0.2)
  google_fonts: ^6.2.1            # Fraunces + Inter served via GFonts
  dio: ^5.7.0                     # HTTP client (Day 4)
  flutter_secure_storage: ^9.2.2  # Session-token storage (Day 4)
  intl: ^0.19.0                   # Date formatting for DOB / timestamps
  uuid: ^4.5.1                    # Idempotency-Key UUIDs (Day 4)
  url_launcher: ^6.3.1            # Paystack checkout in external browser (W7)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fraunces / Inter / JetBrains Mono are bundled rather than fetched at
  # runtime. google_fonts resolves these by filename ({Family}-{Weight}.ttf)
  # and, with allowRuntimeFetching disabled in main(), never touches the
  # network. Two reasons: first launch on a slow Nigerian connection no longer
  # renders in a fallback face while the download completes, and widget tests
  # can render real typography (the test VM has no network, which is what
  # blocked golden captures).
  #
  # Weights match the discipline declared in design/tokens/typography.dart:
  # Fraunces 400/600/700, Inter 400/500/600/700, JetBrains Mono 400.
  assets:
    - assets/google_fonts/
